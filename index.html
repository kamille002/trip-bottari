<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 보따리 · TRIP BOTTARI</title>
<meta name="description" content="여행에서 쓴 돈과 사진을 지도 위에 담는 여행 가계부. 현지 금액을 내 돈으로 바로 환산하고, 오프라인에서도 작동합니다.">
<meta name="theme-color" content="#F4EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행 보따리">
<meta property="og:title" content="여행 보따리 · TRIP BOTTARI">
<meta property="og:description" content="여행에서 쓴 돈과 사진을 지도 위에 담는 여행 가계부">
<meta property="og:image" content="/icons/og.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
:root{
  --ground:#F4EEE3; --card:#FFFDF8; --soft:#FBF4EA; --line:#E4D9C8; --line2:#D9CCB8;
  --ink:#2B2420; --muted:#6E6258; --accent:#C8432F; --deep:#9E2F20; --tint:#FBF0E6; --key2:#E9DFCF;
  --display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E9E1D3;color:var(--ink);font-family:var(--body)}
body{overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
a{color:var(--deep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
.view{position:relative;flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + var(--safe-t)) 18px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.5px;display:block;line-height:1.1}
.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:500}
.h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.pill{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;border-radius:22px;border:1.5px solid var(--line2);background:var(--card)}
.cc{width:30px;height:30px;border-radius:15px;background:var(--ink);color:var(--card);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pill .code{font-size:14px;font-weight:700}
.pill .nm{font-size:12px;color:var(--muted);max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* calculator */
.calc{margin:6px 16px 0;background:var(--card);border-radius:26px;box-shadow:0 1px 0 var(--line),0 10px 24px rgba(80,50,30,.08)}
.calc .a{padding:16px 22px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.ghost{min-height:44px;min-width:44px;padding:0 6px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:500}
.big{font-family:var(--display);font-size:clamp(36px,12vw,52px);line-height:1.05;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:clip}
.divider{position:relative;height:0;border-top:1.5px dashed var(--line);margin:0 22px}
.knot{position:absolute;left:50%;top:-20px;margin-left:-20px;width:40px;height:40px;border-radius:20px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(158,47,32,.3)}
.calc .b{padding:24px 22px 16px;background:var(--soft);border-radius:0 0 26px 26px}
.big2{font-family:var(--display);font-size:clamp(30px,10vw,44px);line-height:1.05;text-align:right;color:var(--deep);white-space:nowrap;overflow:hidden}
.rate{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.rate span:first-child{font-size:11px;color:var(--muted)}
.rate span:last-child{font-size:12px;font-weight:700;white-space:nowrap}
.rate.off span:last-child{color:var(--deep)}
.keys{flex:1 1 auto;min-height:0;max-height:300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(38px,1fr);gap:8px;padding:14px 16px 0}
.keys button{height:auto;min-height:38px;border-radius:16px;border:none;background:var(--card);font-size:24px;font-weight:500;box-shadow:0 1px 0 var(--line);touch-action:manipulation}
.keys button:active{background:var(--key2)}
.keys .bk{background:var(--key2);display:flex;align-items:center;justify-content:center}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;border:none;background:var(--accent);color:var(--card);font-size:16px;font-weight:700;text-decoration:none}
.cta:disabled{opacity:.45}
.cta2{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;border-radius:18px;border:1.5px solid var(--line2);background:var(--card);font-size:15px;font-weight:700}
.pad{padding:12px 16px 12px}

/* records */
.total{margin:4px 16px 0;padding:16px 20px;border-radius:22px;background:var(--ink);color:var(--card);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.total .t1{font-size:12px;color:#D9CCB8;font-weight:500}
.total .t2{font-family:var(--display);font-size:30px;line-height:1.05}
.total .t3{font-size:12px;color:#D9CCB8;text-align:right}
.pend{margin:10px 16px 0;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-radius:16px;border:1.5px dashed var(--accent);background:var(--tint);color:var(--deep);font-size:14px;font-weight:700;width:calc(100% - 32px)}
.pend span:last-child{font-size:13px;font-weight:500}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 6px;font-size:13px;font-weight:700}
.day span:last-child{color:var(--muted)}
.ent{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--card);box-shadow:0 1px 0 var(--line);margin-bottom:8px;width:100%;border:none;text-align:left}
.thumb{width:60px;height:60px;border-radius:14px;background:var(--key2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center}
.ent .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ent .pl{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .mt{font-size:12px;color:var(--muted)}
.ent .amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.ent .amt b{font-size:15px}
.ent .amt small{font-size:12px;color:var(--muted)}
.ent .need{padding:8px 10px;border-radius:12px;background:var(--accent);color:var(--card);font-size:12px;font-weight:700;flex:none}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.fabs{position:absolute;left:16px;right:16px;bottom:12px;display:flex;gap:8px}
.fabs .cta{flex:1.3;box-shadow:0 8px 18px rgba(158,47,32,.28)}
.fabs .cta2{flex:1}

/* map */
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#EDE6D8}
.mapTop{position:absolute;left:12px;right:12px;top:calc(12px + var(--safe-t));z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mapTop>*{pointer-events:auto}
.mapHead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:20px;background:var(--card);box-shadow:0 6px 16px rgba(80,50,30,.12)}
.mapHead .tot{font-family:var(--display);font-size:20px;color:var(--deep)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line2);background:var(--card);font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(80,50,30,.08)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pin{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin span{padding:5px 9px;border-radius:12px;background:var(--ink);color:var(--card);font:700 12px var(--body);white-space:nowrap;box-shadow:0 4px 10px rgba(80,50,30,.2)}
.pin i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink)}
.pin.sel span{background:var(--accent)} .pin.sel i{border-top-color:var(--accent)}
.leaflet-div-icon{background:none;border:none}
.mapCard{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;padding:14px;border-radius:24px;background:var(--card);box-shadow:0 12px 28px rgba(80,50,30,.22);display:none;flex-direction:column;gap:12px}
.mapCard.on{display:flex}
.mapCard .ph{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--key2);flex:none}
.mapCard .hm{font-family:var(--display);font-size:24px;color:var(--deep)}
.btnDark{flex:1;min-height:48px;border-radius:14px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;text-decoration:none;border:none}
.btnLine{min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.mapEmpty{position:absolute;left:24px;right:24px;top:45%;z-index:500;text-align:center;padding:16px;border-radius:18px;background:var(--card);font-size:14px;color:var(--muted);line-height:1.6;box-shadow:0 6px 16px rgba(80,50,30,.12)}

/* settings */
.sec{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.sec>.lbl{font-size:13px;font-weight:700;padding:0 4px}
.box{border-radius:18px;background:var(--card);padding:4px;box-shadow:0 1px 0 var(--line)}
.opt{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:none;border-radius:14px;background:transparent;text-align:left}
.opt[aria-pressed="true"]{background:var(--tint)}
.opt .o1{font-size:15px;font-weight:500;display:block}
.opt .o2{font-size:11px;color:var(--muted)}
.fb{border-radius:18px;background:var(--ink);color:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px}
.fb p{margin:0;font-size:12px;color:#D9CCB8;line-height:1.5}
.small{font-size:12px;color:var(--muted);line-height:1.55}

nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(8px + var(--safe-b))}
nav.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--deep);font-weight:700}
nav.tabs svg{stroke:currentColor}

/* sheets */
.sheet{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;justify-content:flex-end;background:rgba(43,36,32,.45)}
.sheet.on{display:flex}
.sheet .bg{flex:1;border:none;background:transparent}
.sheet .panel{max-width:480px;width:100%;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 0 calc(18px + var(--safe-b));max-height:88dvh;display:flex;flex-direction:column}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);align-self:center;margin-bottom:4px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 4px}
.sheetHead b{font-size:17px}
.sheetBody{overflow-y:auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--ground);margin:4px 20px 8px}
.search input{flex:1;border:none;background:transparent;font-size:16px;outline:none;min-width:0}
.curItem{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 10px;border:none;border-radius:14px;background:transparent;text-align:left}
.curItem[aria-pressed="true"]{background:var(--tint)}
.curItem .c1{font-size:15px;font-weight:700;width:46px}
.curItem .c2{font-size:14px;color:var(--muted);flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;color:var(--muted)}
.inp{min-height:48px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);padding:0 14px;font-size:16px;width:100%}
textarea.inp{padding:12px 14px;min-height:80px;resize:vertical}
.amtRow{display:flex;gap:8px}
.amtRow .inp{flex:1;font-size:22px;font-weight:700}
.amtRow button{flex:none}
.conv{font-size:13px;color:var(--deep);font-weight:700;min-height:18px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cats button{min-height:44px;border-radius:12px;border:1.5px solid var(--line2);background:transparent;font-size:14px;font-weight:500}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
.photoBox{display:flex;gap:10px;align-items:center}
.photoBox img{width:84px;height:84px;border-radius:14px;object-fit:cover;background:var(--key2)}
.photoBtns{display:flex;gap:8px;flex-wrap:wrap}
.btnSm{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);font-size:14px;font-weight:700}
.btnDanger{min-height:48px;border-radius:14px;border:none;background:transparent;color:var(--deep);font-size:14px;font-weight:700}
.loc{font-size:12px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;font-size:14px}
.num{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.iconBox{width:40px;height:40px;border-radius:10px;background:var(--ground);display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.copyRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--ground)}
.copyRow span{flex:1;font-size:14px;font-weight:700;word-break:break-all}

/* welcome */
#welcome{position:fixed;inset:0;z-index:1500;background:var(--ground);display:none;flex-direction:column;overflow-y:auto}
#welcome.on{display:flex}
#welcome .in{max-width:480px;width:100%;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(48px + var(--safe-t)) 0 calc(24px + var(--safe-b))}
.logoBox{width:112px;height:112px;border-radius:30px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line),0 14px 30px rgba(80,50,30,.12)}
.warn{padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--deep);font-size:12px;line-height:1.55;font-weight:500}

.toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translateX(-50%) translateY(-120%);z-index:3000;padding:10px 16px;border-radius:20px;background:var(--ink);color:var(--card);font-size:13px;font-weight:500;max-width:90vw;text-align:center;transition:transform .25s}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-height:720px){
  header.top{padding-top:calc(8px + var(--safe-t));padding-bottom:4px}
  .brand small{display:none}
  .calc .a{padding:6px 18px 8px} .calc .b{padding:16px 18px 8px}
  .calc .row .ghost{min-height:36px}
  .big{font-size:34px} .big2{font-size:28px} .rate{margin-top:2px}
  .keys{gap:6px;padding-top:10px} .keys button{font-size:21px}
  .pad{padding:8px 16px} .pad .cta{height:48px}
  nav.tabs button{min-height:46px}
}
</style>
</head>
<body>
<div id="app">

<!-- 계산기 -->
<section class="view on" id="v-calc" aria-labelledby="tab-calc">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><use href="#bottari"/></svg>
      <div><b data-t="app"></b><small>TRIP BOTTARI</small></div>
    </div>
    <button class="pill" id="curBtn" type="button" aria-haspopup="dialog">
      <span class="cc" id="curCc"></span><span class="code" id="curCode"></span><span class="nm" id="curName"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="#2B2420" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <div class="scroll" style="display:flex;flex-direction:column">
    <section class="calc" aria-live="polite">
      <div class="a">
        <div class="row"><span class="lbl" id="localLbl"></span><button class="ghost" type="button" id="clearBtn" data-t="reset"></button></div>
        <div class="big" id="localTxt"></div>
      </div>
      <div class="divider"><div class="knot"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="#FFFDF8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="b">
        <span class="lbl" id="homeLbl"></span>
        <div class="big2" id="homeTxt"></div>
        <div class="rate" id="rateRow"><span id="rateNote"></span><span id="rateTxt"></span></div>
      </div>
    </section>
    <div class="keys" id="keys"></div>
    <div class="pad"><button class="cta" type="button" id="packBtn"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round"/></svg><span data-t="pack"></span></button></div>
  </div>
</section>

<!-- 기록 -->
<section class="view" id="v-rec" aria-labelledby="tab-rec">
  <header class="top">
    <div><div class="h1" data-t="tabRec"></div><div class="sub" id="recSub"></div></div>
  </header>
  <div class="total"><div><div class="t1" data-t="total"></div><div class="t2" id="totHome"></div></div><div class="t3" id="totSub"></div></div>
  <button class="pend" type="button" id="pendBtn" hidden><span id="pendTxt"></span><span id="pendAct"></span></button>
  <div class="scroll" id="recList" style="padding:0 16px 96px"></div>
  <div class="fabs">
    <button class="cta" type="button" id="quickBtn"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" stroke="#FFFDF8" stroke-width="1.8" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="#FFFDF8" stroke-width="1.8" fill="none"/></svg><span data-t="quick"></span></button>
    <button class="cta2" type="button" id="manualBtn"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#2B2420" stroke-width="2.2" stroke-linecap="round"/></svg><span data-t="manual"></span></button>
  </div>
  <input type="file" accept="image/*" capture="environment" id="quickFile" class="sr" tabindex="-1" aria-hidden="true">
</section>

<!-- 지도 -->
<section class="view" id="v-map" aria-labelledby="tab-map">
  <div id="mapWrap">
    <div id="map" role="region" aria-label="map"></div>
    <div class="mapTop">
      <div class="mapHead"><div><div class="h1" style="font-size:22px" data-t="tabMap"></div><div class="sub" id="mapSub"></div></div><div class="tot" id="mapTot"></div></div>
      <div class="chips" id="dayChips" role="group"></div>
    </div>
    <div class="mapEmpty" id="mapEmpty" hidden></div>
